<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Trivia Quiz</title>
<style>
  :root {
    --bg: #061421;
    --accent1: #38bdf8;
    --accent2: #a3e635;
    --bad: #fb7185;
    --text: #e6f4ff;
    --muted: #6b8299;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 0%, #0c2338 0%, var(--bg) 65%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }
  .wrap { width: 100%; max-width: 620px; }
  h1 {
    font-size: 2rem;
    margin: 0 0 6px;
    color: var(--accent1);
    text-shadow: 0 0 12px rgba(56,189,248,0.6);
  }
  .subtitle { color: var(--muted); margin-bottom: 18px; font-size: 0.9rem; }
  .card {
    background: rgba(56,189,248,0.06);
    border: 1px solid rgba(56,189,248,0.25);
    border-radius: 18px;
    padding: 26px;
    box-shadow: 0 0 40px rgba(56,189,248,0.1);
    margin-bottom: 18px;
  }
  .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .score { font-size: 0.9rem; color: var(--muted); }
  .score b { color: var(--accent2); }
  .question-text { font-size: 1.2rem; line-height: 1.5; margin-bottom: 18px; min-height: 2.2em; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  button.option {
    text-align: left;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid rgba(56,189,248,0.3);
    background: rgba(0,0,0,0.2);
    color: var(--text);
    font-size: 0.95rem;
    cursor: pointer;
  }
  button.option:hover:not(:disabled) { border-color: var(--accent1); }
  button.option:disabled { cursor: default; }
  button.option.correct { background: rgba(163,230,53,0.15); border-color: var(--accent2); color: var(--accent2); }
  button.option.wrong { background: rgba(251,113,133,0.15); border-color: var(--bad); color: var(--bad); }
  button.action {
    margin-top: 16px;
    padding: 12px 26px;
    border: none;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    background: linear-gradient(90deg, var(--accent1), #0284c7);
    color: #061421;
    box-shadow: 0 0 20px rgba(56,189,248,0.5);
  }
  .status { margin-top: 10px; font-size: 0.85rem; color: var(--muted); min-height: 1.2em; }
  .footer-note { color: var(--muted); font-size: 0.8rem; text-align: center; margin-top: 20px; }
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(56,189,248,0.3);
    border-top-color: var(--accent1);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <h1>QVAC Trivia Quiz</h1>
    <p class="subtitle">AI writes the question from a real fact, RAG pulls the wrong answers from related facts. 100% on-device.</p>

    <div class="card">
      <div class="top-row">
        <span class="score">Score: <b id="correct">0</b> / <b id="total">0</b></span>
        <button class="action" id="newBtn" style="margin-top:0;">New Question</button>
      </div>
      <div class="question-text" id="questionText">Click "New Question" to begin.</div>
      <div class="options" id="options"></div>
      <div class="status" id="status"></div>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const newBtn = document.getElementById('newBtn');
    const questionText = document.getElementById('questionText');
    const optionsEl = document.getElementById('options');
    const status = document.getElementById('status');
    const correctEl = document.getElementById('correct');
    const totalEl = document.getElementById('total');

    function renderScore(score) {
      correctEl.textContent = score.correct;
      totalEl.textContent = score.total;
    }

    async function newQuestion() {
      newBtn.disabled = true;
      optionsEl.innerHTML = '';
      status.innerHTML = '<span class="spinner"></span>Writing a question...';

      try {
        const res = await fetch('/api/new-question', { method: 'POST' });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        questionText.textContent = data.question;
        renderScore(data.score);
        status.textContent = '';

        data.options.forEach((opt, i) => {
          const btn = document.createElement('button');
          btn.className = 'option';
          btn.textContent = opt;
          btn.addEventListener('click', () => answer(i));
          optionsEl.appendChild(btn);
        });
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        newBtn.disabled = false;
      }
    }

    async function answer(index) {
      const buttons = [...optionsEl.querySelectorAll('button')];
      buttons.forEach((b) => (b.disabled = true));

      try {
        const res = await fetch('/api/answer', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ index }),
        });
        const data = await res.json();
        renderScore(data.score);

        buttons[data.correctIndex].classList.add('correct');
        if (!data.correct) buttons[index].classList.add('wrong');

        status.textContent = data.correct ? 'Correct!' : 'Not quite.';
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      }
    }

    newBtn.addEventListener('click', newQuestion);
  </script>
</body>
</html>
